name: walshit-landing-production

services:
  landing-hugo:
    image: ghcr.io/walshg3/walshit-landing:${IMAGE_TAG:?IMAGE_TAG is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}
    platform: linux/amd64
    user: "101:101"
    labels:
      com.walshit.service: landing
      source-revision: "${IMAGE_TAG:?IMAGE_TAG is required}"
    ports:
      - "${PORT_BINDING:-192.168.5.252:3003:8080}"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cpus: "0.50"
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(wget -qO- http://127.0.0.1:8080/healthz.txt)\" = \"walshit-landing-hugo-ok\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - production

networks:
  production:
    external: true
    name: walshit-landing-hugo-prod-9238dbfa_default
