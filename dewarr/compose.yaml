name: dewarr
services:
  dewarr:
    image: ghcr.io/logabell/dewarr@sha256:83d07954013daa1b950cfd5d0c68828cd6aaac9dd29571ab041bce492ceac132
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/New_York
      PUBLIC_URL: http://192.168.5.252:8085
      DB_HOST: postgres
      DB_NAME: dewarr
      DB_USER: dewarr
      DB_PASSWORD: ${DB_PASSWORD:?required}
      BOOK_DOWNLOAD_DISPATCH_ENABLED: 'false'
    volumes:
    - /home/port/.local/state/hermes/dewarr/config:/config
    - /home/port/.local/state/hermes/dewarr/data:/data
    - media:/share:ro
    tmpfs:
    - /tmp:size=256m,mode=1777,nosuid,nodev
    ports:
    - 192.168.5.252:8085:8000
    networks:
    - egress
    - database
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    profiles:
    - retained-pilot
  postgres:
    image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    security_opt:
    - no-new-privileges:true
    environment:
      POSTGRES_DB: dewarr
      POSTGRES_USER: dewarr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
    - postgres:/var/lib/postgresql
    tmpfs:
    - /tmp:size=64m,mode=1777,nosuid,nodev
    - /var/run/postgresql:size=16m,mode=3775,uid=999,gid=999,nosuid,nodev
    networks:
    - database
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U dewarr -d dewarr
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  importer:
    image: ghcr.io/logabell/dewarr@sha256:83d07954013daa1b950cfd5d0c68828cd6aaac9dd29571ab041bce492ceac132
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/New_York
      PUBLIC_URL: http://192.168.5.252:8085
      DB_HOST: postgres
      DB_NAME: dewarr
      DB_USER: dewarr
      DB_PASSWORD: ${DB_PASSWORD:?required}
      BOOK_DOWNLOAD_DISPATCH_ENABLED: 'true'
    volumes:
    - /home/port/.local/state/hermes/dewarr/config:/config
    - /home/port/.local/state/hermes/dewarr/data:/data
    - media:/share:ro
    - managed:/managed
    - type: volume
      source: media
      target: /share/torrents/dewarr
      volume:
        subpath: torrents/dewarr
    tmpfs:
    - /tmp:size=256m,mode=1777,nosuid,nodev
    ports:
    - 192.168.5.252:8085:8000
    networks:
    - egress
    - database
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    profiles:
    - retained-initial-mount
  ebooks:
    image: ghcr.io/logabell/dewarr@sha256:83d07954013daa1b950cfd5d0c68828cd6aaac9dd29571ab041bce492ceac132
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: America/New_York
      PUBLIC_URL: http://192.168.5.252:8085
      DB_HOST: postgres
      DB_NAME: dewarr
      DB_USER: dewarr
      DB_PASSWORD: ${DB_PASSWORD:?required}
      BOOK_DOWNLOAD_DISPATCH_ENABLED: 'true'
    volumes:
    - /home/port/.local/state/hermes/dewarr/config:/config
    - /home/port/.local/state/hermes/dewarr/data:/data
    - media:/share:ro
    - type: volume
      source: media
      target: /share/torrents/dewarr
      volume:
        subpath: torrents/dewarr
    - type: volume
      source: managed
      target: /managed
      volume:
        subpath: media/dewarr
    tmpfs:
    - /tmp:size=256m,mode=1777,nosuid,nodev
    ports:
    - 192.168.5.252:8085:8000
    networks:
    - egress
    - database
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    profiles:
    - retained-stock-ebooks
  app:
