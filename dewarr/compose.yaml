    - type: volume
      source: managed
      target: /managed
      volume:
        subpath: media/dewarr
    tmpfs:
    - /tmp:size=256m,mode=1777,nosuid,nodev
    ports:
    - 192.168.5.252:8085:8000
    networks:
    - egress
    - database
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    pull_policy: never
    profiles:
    - retained-smb
  app-sab5:
