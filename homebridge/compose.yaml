services:
  homebridge:
    image: homebridge/homebridge:2026-08-17@sha256:e424c8007c522b978d55ed5cf07de99c635e4f72a1dfd893b587dccf76779cb2
    restart: always
    network_mode: host
    volumes:
      - ./volumes/homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}