services:
  maintainerr:
    image: maintainerr/maintainerr@sha256:8759d68ceef64093893596df78d9045b5d100e59409af6cea14d41735ba7de5a
    container_name: maintainerr
    user: "1000:1000"
    init: true
    environment:
      TZ: America/New_York
    volumes:
      - type: bind
        source: ./data
        target: /opt/data
    ports:
      - "192.168.5.252:6246:6246"
    networks:
      - arr
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6246/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arr:
    external: true
    name: arr_default
